name: Daily Stock Coach

on:
  schedule:
    # 20:30 UTC = 4:30 PM EDT (spring/summer) — after the 4 PM ET close
    # 21:30 UTC = 4:30 PM EST (fall/winter) — after the 4 PM ET close
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scan.py

      - name: Commit updated positions.json
        run: |
          git config user.name "cp-daily-coach-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -f positions.json ]; then
            git add positions.json
            git diff --cached --quiet && echo "No position changes to commit" || git commit -m "Update positions.json [automated]"
            git push
          else
            echo "positions.json does not exist yet — nothing to commit."
          fi
