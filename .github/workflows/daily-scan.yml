name: Daily Stock Coach

on:
  schedule:
    # 21:00 UTC = 4:00 PM ET (5:00 PM during daylight saving).
    # Runs after the market closes; adjust if you want it earlier/later.
    - cron: '0 21 * * 1-5'   # weekdays only
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scan.py

      # positions.json changes (HOLD gains, SELL removals) need to be saved
      # back to the repo, or every run starts fresh with no memory of what
      # you're holding. Skips cleanly if the file doesn't exist yet (no
      # trades tracked so far) instead of failing the workflow.
      - name: Commit updated positions.json
        run: |
          git config user.name "cp-daily-coach-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f positions.json ]; then
            git add positions.json
            git diff --cached --quiet && echo "No position changes to commit" || git commit -m "Update positions.json [automated]"
            git push
          else
            echo "positions.json does not exist yet — nothing to commit."
          fi
