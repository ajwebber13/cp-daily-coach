name: Pre-Market 6-Check Watch

on:
  schedule:
    # 10:00 UTC = 6:00 AM ET during daylight saving (7:00 AM ET during
    # standard time — GitHub cron doesn't shift with DST, so this drifts
    # an hour later in winter unless you adjust it back to '0 11 * * 1-5').
    # Gives you ~3.5 hours of pre-market data before the 9:30 AM ET open.
    - cron: '0 10 * * 1-5'   # weekdays only
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab

jobs:
  premarket:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pre-market scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python premarket.py
