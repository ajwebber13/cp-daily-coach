name: Pre-Market Movers

on:
  schedule:
    # 12:15 UTC = 7:15 AM ET during daylight saving (8:15 AM ET during
    # standard time, since GitHub cron doesn't shift with DST). Gives you
    # ~2 hours of pre-market data before the 9:30 AM ET open. Adjust the
    # time below if you want it closer to open.
    - cron: '15 12 * * 1-5'   # weekdays only
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab

jobs:
  premarket:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pre-market scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python premarket.py
